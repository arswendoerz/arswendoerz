name: Contribution graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5EEAD4&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      # snk runs in Docker, so dist/ belongs to root; gather everything in a new folder.
      - name: Loop 3D graph animation and collect graphics
        run: |
          node .github/scripts/loop-3d.js profile-3d-contrib/profile-3d.svg
          mkdir -p out
          cp dist/*.svg profile-3d-contrib/profile-3d.svg out/
          ls -la out

      # Both graphics share the output branch, which is replaced on every run.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
