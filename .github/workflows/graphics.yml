name: Contribution graphics

on:
  schedule:
    # 00:23 and 12:23 WIB; off the top of the hour, when GitHub drops or delays runs.
    - cron: "23 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Loop 3D graph animation
        run: |
          node .github/scripts/loop-3d.js profile-3d-contrib/profile-3d.svg
          mkdir -p out
          cp profile-3d-contrib/profile-3d.svg out/

      # The output branch is replaced on every run.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
