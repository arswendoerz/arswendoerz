<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Footer">
  <defs>
    <radialGradient id="elMetal" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#6670AC"/><stop offset=".45" stop-color="#2E3460"/><stop offset="1" stop-color="#121427"/>
    </radialGradient>
    <radialGradient id="elEar" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#4C5590"/><stop offset=".6" stop-color="#252A4D"/><stop offset="1" stop-color="#101222"/>
    </radialGradient>
    <linearGradient id="elGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset=".45" stop-color="#F2C46D"/><stop offset="1" stop-color="#A86F24"/>
    </linearGradient>
    <linearGradient id="elRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset=".45" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset=".55" stop-color="#A78BFA" stop-opacity="0"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="elShadow">
      <stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elHalo">
      <stop offset="0" stop-color="#F2C46D" stop-opacity=".45"/><stop offset="1" stop-color="#F2C46D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elCore">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#9FF7E8"/><stop offset="1" stop-color="#5EEAD4" stop-opacity=".25"/>
    </radialGradient>
    <filter id="elGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="elSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <style>
    .el-bob{animation:el-bob 3.2s ease-in-out infinite}
    @keyframes el-bob{50%{transform:translateY(-4px)}}
    .el-earL{animation:el-earL 2.6s ease-in-out infinite}
    @keyframes el-earL{50%{transform:rotate(-8deg)}}
    .el-earR{animation:el-earR 2.6s ease-in-out infinite}
    @keyframes el-earR{50%{transform:rotate(8deg)}}
    .el-blink{animation:el-blink 4.5s infinite}
    @keyframes el-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
    .el-wave{animation:el-wave 1.1s ease-in-out infinite alternate}
    @keyframes el-wave{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
    .el-type{animation:el-type .32s ease-in-out infinite alternate}
    @keyframes el-type{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
    .el-point{animation:el-point 1.4s ease-in-out infinite alternate}
    @keyframes el-point{from{transform:rotate(4deg)}to{transform:rotate(-6deg)}}
    .el-sway{animation:el-sway 2.4s ease-in-out infinite alternate}
    @keyframes el-sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
    .el-led{animation:el-led 1.8s ease-in-out infinite}
    @keyframes el-led{50%{opacity:.35}}
    .el-core{animation:el-core 2.2s ease-in-out infinite}
    @keyframes el-core{50%{opacity:.45}}
    .el-flow{stroke-dasharray:4 3;animation:el-flow 1s linear infinite}
    @keyframes el-flow{to{stroke-dashoffset:-14}}
    .el-shimmer{animation:el-shimmer 3s ease-in-out infinite}
    @keyframes el-shimmer{50%{opacity:.4}}
    .el-spin{animation:el-spin 6s linear infinite}
    @keyframes el-spin{to{transform:rotate(360deg)}}
    .w0{animation:w0 14s linear infinite}
    @keyframes w0{to{transform:translateX(-400px)}}
    .w1{animation:w1 18s linear infinite}
    @keyframes w1{to{transform:translateX(-600px)}}
    .w2{animation:w2 10s linear infinite}
    @keyframes w2{to{transform:translateX(-300px)}}
  </style>
