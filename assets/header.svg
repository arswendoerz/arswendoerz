<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Arswendo Erza Sadewa, Fullstack Web Developer</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset=".5" stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#38B2AC" stop-opacity=".55"/><stop offset="1" stop-color="#38B2AC" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#4F8CC9" stop-opacity=".5"/><stop offset="1" stop-color="#4F8CC9" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <style>
    .b1{animation:d1 14s ease-in-out infinite alternate}
    .b2{animation:d2 18s ease-in-out infinite alternate}
    .b3{animation:d3 16s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(160px,40px)}}
    @keyframes d2{to{transform:translate(-180px,-30px)}}
    @keyframes d3{to{transform:translate(-120px,50px)}}
    .up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,monospace}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#13141f"/>
    <circle class="b1" cx="180" cy="60" r="260" fill="url(#g1)"/>
    <circle class="b2" cx="1060" cy="250" r="300" fill="url(#g2)"/>
    <circle class="b3" cx="760" cy="-20" r="240" fill="url(#g3)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g text-anchor="middle">
    <text class="up mono" x="480" y="92" font-size="17" fill="#7DCFFF" letter-spacing="3">HI, I'M</text>
    <text class="up d1" x="480" y="158" font-size="58" font-weight="800" fill="url(#name)">Arswendo Erza Sadewa</text>
    <text class="up d2 mono" x="480" y="205" font-size="20" fill="#C0CAF5">&lt;Fullstack Web Developer /&gt;<tspan class="cur" fill="#5EEAD4">_</tspan></text>
    <text class="up d3" x="480" y="250" font-size="15" fill="#737AA2" letter-spacing="1">Bandar Lampung, Indonesia  ·  Informatics, Universitas Lampung</text>
  </g>
  <!-- mascot --><defs>
    <radialGradient id="elMetal" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#7C87CB"/><stop offset=".45" stop-color="#3A4178"/><stop offset="1" stop-color="#171A32"/>
    </radialGradient>
    <radialGradient id="elEar" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#5A64A6"/><stop offset=".6" stop-color="#2D335E"/><stop offset="1" stop-color="#14172B"/>
    </radialGradient>
    <linearGradient id="elGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset=".45" stop-color="#F2C46D"/><stop offset="1" stop-color="#A86F24"/>
    </linearGradient>
    <linearGradient id="elRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset=".45" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset=".55" stop-color="#A78BFA" stop-opacity="0"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="elShadow">
      <stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elHalo">
      <stop offset="0" stop-color="#F2C46D" stop-opacity=".45"/><stop offset="1" stop-color="#F2C46D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elCore">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#9FF7E8"/><stop offset="1" stop-color="#5EEAD4" stop-opacity=".25"/>
    </radialGradient>
    <filter id="elGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="elSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>
    .el-bob{animation:el-bob 3.2s ease-in-out infinite}
    @keyframes el-bob{50%{transform:translateY(-4px)}}
    .el-earL{animation:el-earL 2.6s ease-in-out infinite}
    @keyframes el-earL{50%{transform:rotate(-8deg)}}
    .el-earR{animation:el-earR 2.6s ease-in-out infinite}
    @keyframes el-earR{50%{transform:rotate(8deg)}}
    .el-blink{animation:el-blink 4.5s infinite}
    @keyframes el-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
    .el-led{animation:el-led 1.8s ease-in-out infinite}
    @keyframes el-led{50%{opacity:.35}}
    .el-core{animation:el-core 2.2s ease-in-out infinite}
    @keyframes el-core{50%{opacity:.45}}
    .el-flow{stroke-dasharray:4 3;animation:el-flow 1s linear infinite}
    @keyframes el-flow{to{stroke-dashoffset:-14}}
    .el-shimmer{animation:el-shimmer 3s ease-in-out infinite}
    @keyframes el-shimmer{50%{opacity:.4}}
    .el-spin{animation:el-spin 6s linear infinite}
    @keyframes el-spin{to{transform:rotate(360deg)}}
    .el-waddle{transform-origin:0 122px;animation:el-waddle .9s ease-in-out infinite alternate}
    @keyframes el-waddle{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-2px)}}
    .el-stepL{animation:el-step .9s ease-in-out infinite alternate}
    .el-stepR{animation:el-step .9s ease-in-out infinite alternate-reverse}
    @keyframes el-step{from{transform:translateY(0)}to{transform:translateY(-7px)}}</style>
  <defs>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".5"/><stop offset=".5" stop-color="#4F8CC9" stop-opacity=".22"/><stop offset="1" stop-color="#4F8CC9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disk">
      <stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".42" stop-color="#F2C46D" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#A78BFA" stop-opacity=".55"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
    .bh{animation:bh 12s cubic-bezier(.4,0,.2,1) infinite}
